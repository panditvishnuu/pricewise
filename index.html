<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      table {
        width: 40%;
        text-transform: uppercase;
        text-align: left;
        margin: 20px;
        padding: 10px;
        border-collapse: collapse;
        font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
          "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
        border-bottom: 3px solid gray;
        box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.194);
      }
      table tr {
        margin-top: 20px;
        height: 50px;
      }
      table th {
        background-color: green;
        padding: 5rem;
        color: white;
      }
      table th,
      table td {
        text-align: center;
        padding: 8px 12px;
        border-bottom: 2px solid rgba(128, 128, 128, 0.66);
      }
      table tr:nth-child(even) {
        background-color: #fff; /* Light gray background for odd rows */
      }

      table tr:nth-child(odd) {
        background-color: #d9d7d7e1; /* White background for even rows */
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <th>rank</th>

        <th>team</th>
      </tr>

      </tr>
      <tr>

</html>
